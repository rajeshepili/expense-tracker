name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate-routes
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      # Both deployment modes must build — the two Vercel projects use different route trees.
      - run: pnpm build:app
      - run: pnpm build:mkt
      - run: pnpm assert:mkt-bundle
